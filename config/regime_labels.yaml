# Human-readable regime name overrides.
# After clustering, the profiler assigns a label based on statistics.
# These entries pin specific cluster IDs to names once clusters stabilize.
# Format:  cluster_id: "Name"

# Pinned for balanced_cluster IDs 0..4 (clustering.balanced_k=5 in config/settings.yaml).
0: "Stagflation"
1: "Growth Boom"
2: "Deflationary Recession"
3: "Low-Rate Expansion"
4: "Crisis / Deleveraging"
